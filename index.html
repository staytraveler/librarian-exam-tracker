<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>librarian-exam-tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

  <app-header></app-header>

  <main>
    <section class="panel">
      <h2>librarian-exam-tracker</h2>
      <p class="hint">
        사서직 임용시험 모의고사 회차별 성적을 기록하고 세부과목별 정답률을 확인합니다.
      </p>
    </section>

    <section class="panel">
      <h2>데이터 백업 / 복원</h2>
      <p class="hint">
        데이터는 이 브라우저에만 저장됩니다. 다른 기기로 옮기려면 아래에서 복사한 뒤,
        옮길 기기의 붙여넣기 칸에 넣고 적용하세요.
      </p>

      <label for="exportArea">내 데이터 (복사해서 백업)</label>
      <textarea id="exportArea" rows="4" readonly></textarea>
      <button id="copyBtn" type="button" class="secondary">클립보드에 복사</button>

      <div class="field-block">
        <label for="importArea">붙여넣기 (다른 기기 데이터 가져오기)</label>
        <textarea id="importArea" rows="4" placeholder="여기에 백업 데이터를 붙여넣으세요"></textarea>
        <button id="importBtn" type="button" class="primary">적용하기</button>
      </div>
    </section>

    <section class="panel">
      <h2>초기화</h2>
      <p class="hint">
        저장된 모든 회차 기록을 삭제합니다. 되돌릴 수 없으니, 필요하면 먼저 위에서 백업하세요.
      </p>
      <button id="resetBtn" type="button" class="danger">전체 초기화</button>
    </section>
  </main>

  <app-footer></app-footer>

  <script type="module" src="/js/components/app-header.js"></script>
  <script type="module" src="/js/components/app-footer.js"></script>
  <script type="module" src="/js/home-page.js"></script>
</body>
</html>
